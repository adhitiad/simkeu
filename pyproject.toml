[project]
name = "simkeu-pts"
version = "0.1.0"
description = "Sistem Informasi Keuangan PTS (Django + HTMX)"
requires-python = ">=3.14.5"
dependencies = [
  "django>=6.1.3",
  "djangorestframework>=3.18.3",
  "psycopg[binary]>=3.3.9",
  "django-environ>=0.14.0",
  "celery>=5.7.0",
  "django-celery-results>=2.5",
  "structlog>=26.1.0",
  "whitenoise>=6.12.0",
  "gunicorn>=27.0.1",
  "httpx>=0.28.1",
  "tenacity>=9.2.1",
  "django-htmx>=1.29.0",
  "django-tailwind>=4.6.0",
  "django-structlog>=11.0.0",
  "django-prometheus>=2.5.0",
  "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-django>=4.14.0",
  "pytest-cov>=7.1.0",
  "hypothesis>=6.112",
  "ruff>=0.17.5",
  "mypy>=2.4.1",
  "django-stubs>=6.1.2",
  "djangorestframework-stubs>=3.18.2",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
  "factory-boy>=3.3.3",
  "playwright>=1.65.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
exclude = [".venv", ".venv314", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DJ"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "simkeu.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "simkeu.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q --reuse-db"

[tool.coverage.run]
source = ["apps", "simkeu"]
omit = ["*/migrations/*", "*/tests/*"]
