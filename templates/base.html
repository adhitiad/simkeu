<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SIMKEU PTS{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"
    integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
    crossorigin="anonymous"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }

    header {
      background: #0f172a;
      color: #fff;
      padding: 1rem 2rem;
    }

    main {
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.25rem;
    }

    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
  </style>
</head>

<body>
  <header><strong>SIMKEU PTS</strong> — Sistem Informasi Keuangan</header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>

</html>
